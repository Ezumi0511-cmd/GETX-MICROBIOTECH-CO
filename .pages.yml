# Pages CMS 設定檔（https://pagescms.org）—— 定義後台可以編輯哪些內容
# 圖片會上傳到 images/ 資料夾
media:
  input: images
  output: /images
  categories: [image]

content:
  - name: settings
    label: "基本設定（品牌、聯絡方式、預約）"
    type: file
    path: content/settings.json
    format: json
    fields:
      - name: brand
        label: "品牌素材"
        type: object
        fields:
          - name: name
            label: "名稱"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: fullName
            label: "公司全名"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: logoImage
            label: "Logo 圖片（建議透明背景）"
            type: image
          - name: logoLetter
            label: "無 Logo 時顯示的字母"
            type: string
          - name: color
            label: "品牌標準色（色碼，如 #1f4fd8）"
            type: string
          - name: colorDark
            label: "標準色深色版（滑鼠移入時）"
            type: string
      - name: contact
        label: "聯絡方式"
        type: object
        fields:
          - name: phone
            label: "電話"
            type: string
          - name: fax
            label: "傳真（留空則不顯示）"
            type: string
          - name: email
            label: "電子郵件"
            type: string
          - name: address
            label: "地址"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: hours
            label: "營業時間（留空則不顯示）"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: mapUrl
            label: "Google 地圖連結（選填）"
            type: string
      - name: booking
        label: "線上預約"
        type: object
        fields:
          - name: endpoint
            label: "後端服務網址（Google Apps Script 網址；填了才會保存聯絡紀錄、顯示今日瀏覽人次。留空＝表單改用郵件軟體寄出）"
            type: string
          - name: slots
            label: "可預約時段"
            type: string
            list: true

  - name: hero
    label: "首頁主視覺"
    type: file
    path: content/hero.json
    format: json
    fields:
      - name: image
        label: "背景圖片（人物或重點建議在右側，左側放文字）"
        type: image
      - name: eyebrow
        label: "小標"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: title
        label: "標題"
        type: object
        fields:
          - { name: zh, label: "中文", type: text }
          - { name: en, label: "English", type: text }
      - name: lead
        label: "引言"
        type: object
        fields:
          - { name: zh, label: "中文", type: text }
          - { name: en, label: "English", type: text }
      - name: primary
        label: "主要按鈕文字"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: secondary
        label: "次要按鈕文字"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: stats
        label: "數據"
        type: object
        list:
          collapsible: true
        fields:
          - name: value
            label: "內容"
            type: string
          - name: label
            label: "名稱"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }

  - name: about
    label: "公司簡介"
    type: file
    path: content/about.json
    format: json
    fields:
      - name: image
        label: "圖片（留空則不顯示）"
        type: image
      - name: title
        label: "標題"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: paragraphs
        label: "段落"
        type: object
        list: true
        fields:
          - { name: zh, label: "中文", type: text }
          - { name: en, label: "English", type: text }
      - name: industriesTitle
        label: "客戶群標題"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: industries
        label: "主要客戶群（產業標籤，清空則隱藏）"
        type: object
        list: true
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: facts
        label: "公司資料"
        type: object
        list:
          collapsible: true
        fields:
          - name: label
            label: "名稱"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: value
            label: "內容"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }

  - name: story
    label: "微生物控制技術"
    type: file
    path: content/story.json
    format: json
    fields:
      - name: image
        label: "圖片（留空則不顯示）"
        type: image
      - name: title
        label: "標題"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: quote
        label: "重點引言"
        type: object
        fields:
          - { name: zh, label: "中文", type: text }
          - { name: en, label: "English", type: text }
      - name: paragraphs
        label: "段落"
        type: object
        list: true
        fields:
          - { name: zh, label: "中文", type: text }
          - { name: en, label: "English", type: text }
      - name: listTitle
        label: "右側清單標題"
        type: object
        fields:
          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: milestones
        label: "右側清單（營業項目／里程碑，清空則隱藏）"
