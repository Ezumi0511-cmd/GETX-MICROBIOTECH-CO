          - { name: zh, label: "中文", type: string }
          - { name: en, label: "English", type: string }
      - name: items
        label: "項目"
        type: object
        list:
          collapsible: true
        fields:
          - name: name
            label: "名稱"
            type: object
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }
          - name: desc
            label: "簡短說明"
            type: object
            fields:
              - { name: zh, label: "中文", type: text }
              - { name: en, label: "English", type: text }
          - name: audience
            label: "適用範圍"
            type: object
            fields:
              - { name: zh, label: "中文", type: text }
              - { name: en, label: "English", type: text }
          - name: specs
