            type: string
          - name: text
            label: "說明"
            type: object
            fields:
              - { name: zh, label: "中文", type: text }
              - { name: en, label: "English", type: text }

  - name: services
    label: "產品介紹"
    type: file
    path: content/services.json
    format: json
    fields:
      - name: image
        label: "橫幅圖片（留空則不顯示）"
