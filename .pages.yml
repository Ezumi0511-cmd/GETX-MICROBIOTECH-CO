            type: object
            list: true
            fields:
              - { name: zh, label: "中文", type: string }
              - { name: en, label: "English", type: string }

  - name: process
    label: "服務流程"
    type: file
    path: content/process.json
    format: json
    fields:
      - name: title
        label: "標題"
        type: object
